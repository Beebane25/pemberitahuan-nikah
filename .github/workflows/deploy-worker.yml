name: Deploy Worker API

# Halaman (Pages) di-deploy otomatis oleh Cloudflare lewat Connect Git.
# Workflow ini HANYA untuk Worker API: worker.mjs -> pemberitahuan-nikah.zulfajrisurya30.workers.dev
#
# Butuh 1 secret di repo: CLOUDFLARE_API_TOKEN
#   Permission: Account -> Workers Scripts: Edit
#
# Kalau secret belum diisi, job selesai hijau tapi deploy dilewati (bukan gagal).

on:
  push:
    branches: [main]
    paths:
      - 'worker.mjs'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: true

env:
  CLOUDFLARE_ACCOUNT_ID: 129c0648f957bd84a82642a46882d243

jobs:
  deploy:
    name: Deploy Worker API
    runs-on: ubuntu-latest
    steps:
      - name: Cek secret
        id: cek
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice title=Deploy Worker dilewati::CLOUDFLARE_API_TOKEN belum diisi di Settings > Secrets and variables > Actions"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.cek.outputs.skip == 'false'
        uses: actions/checkout@v4

      # wrangler menjalankan build.command (node build.mjs) sendiri sesuai wrangler.jsonc,
      # karena Worker ini menyajikan aset statis dari ./public
      - name: Deploy Worker
        if: steps.cek.outputs.skip == 'false'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Cek endpoint API
        if: steps.cek.outputs.skip == 'false'
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://pemberitahuan-nikah.pages.dev/api/wishes)
          echo "GET /api/wishes -> HTTP $code (harus 405)"
          test "$code" = "405"
